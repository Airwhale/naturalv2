defaults:
  - source@sources.reddit: reddit_20k
  - source@sources.pubmed: pubmed
  - _self_

ate: False
seed: 42
experiment_name: ???
conditions:
  - Nervous System Diseases
train_ratio: 0.6
save_path: ${oc.env:SAVE_PATH,./outputs}

# Stop before estimation when validation rejects too much of a sample. The
# override is intended for explicit exploratory runs; an all-rejected sample
# still fails because there are no surviving records to estimate from.
sample_validation:
  high_rejection_rate: 0.10
  allow_high_rejection_rate: false

# Metadata
date_time: ${now:%Y-%m-%d}_${now:%H-%M-%S}
